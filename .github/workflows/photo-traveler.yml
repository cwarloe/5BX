name: Photographic review gallery

on:
  pull_request:
    paths:
      - 'sprites/docs/photo_batches/2026-11-26/**'
      - 'sprites/kit/photo_traveler.py'
      - 'sprites/kit/review_board.py'
      - 'sprites/tests/test_photo_traveler.py'
      - '.github/workflows/photo-traveler.yml'
  push:
    branches: [main]
    paths:
      - 'sprites/docs/photo_batches/2026-11-26/**'
      - 'sprites/kit/photo_traveler.py'
      - 'sprites/kit/review_board.py'
      - 'sprites/tests/test_photo_traveler.py'
      - '.github/workflows/photo-traveler.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate read-only gallery parsing
        run: python3 -m unittest discover -s sprites/tests -p 'test_photo_traveler.py' -v
      - name: Generate charts and Chart 1 pilot views
        run: |
          python3 sprites/kit/review_board.py --photos --out artifacts/review-photos.html
          python3 sprites/kit/review_board.py --photos --chart 1 --out artifacts/review-photo-chart1.html
      - name: Attach visual outputs to this workflow run
        uses: actions/upload-artifact@v4
        with:
          name: photographic-review-traveler
          path: artifacts/*.html
          if-no-files-found: error
          retention-days: 14
