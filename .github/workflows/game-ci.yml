name: Game regression checks

on:
  pull_request:
    paths:
      - 'game/**'
      - '.github/workflows/game-ci.yml'
  push:
    branches: [main]
    paths:
      - 'game/**'
      - '.github/workflows/game-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: game/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run game regression tests
        run: npm test
      - name: Check TypeScript
        run: npm run typecheck
      - name: Build development preview without deploying
        run: npm run build:dev
