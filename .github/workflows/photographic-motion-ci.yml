name: Photographic motion contracts

on:
  pull_request:
    paths:
      - 'photo_motion/**'
      - '.github/workflows/photographic-motion-ci.yml'
  push:
    branches: [main]
    paths:
      - 'photo_motion/**'
      - '.github/workflows/photographic-motion-ci.yml'

permissions:
  contents: read

jobs:
  motion-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install video inspection dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m pip install 'Pillow>=10,<13'
      - name: Validate current photographic movement contracts
        run: python3 -m photo_motion validate photo_motion/specs/*.json
      - name: Run motion sequencing and real-video inspection tests
        run: python3 -m unittest discover -s photo_motion/tests -v
