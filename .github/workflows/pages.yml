# Publishes https://cwarloe.github.io/5BX/
#   /5BX/       the workout app (repo root, served as-is)
#   /5BX/game/  the arcade game (built from game/ with `npm run pages`)
#   /5BX/sprite-boy/  the Sprite Boy demo (the `sprite-boy-demo` branch, copied as-is)
#
# One-time setting: Settings → Pages → Build and deployment → Source:
# "GitHub Actions". Until then the site keeps deploying from the branch and
# this workflow's deploy step fails harmlessly.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Sprite Boy demo is generated art, so it lives on its own branch, not on main.
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: sprite-boy-demo
          path: _demo

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json

      - name: Build the game
        working-directory: game
        run: |
          npm ci --no-audit --no-fund
          npm run pages

      - name: Assemble the site
        run: |
          mkdir _site
          rsync -a ./ _site/ \
            --exclude .git --exclude .github --exclude _site \
            --exclude node_modules --exclude game --exclude specs --exclude _demo
          cp -r game/dist-pages _site/game
          if [ -f _demo/index.html ]; then
            mkdir -p _site/sprite-boy
            rsync -a _demo/ _site/sprite-boy/ --exclude .git
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
